# E8-F1（sprints/sprint-27-dor.md）：每日自動備份，資料庫（public schema）＋
# Storage 全量，打包上傳 Google Drive，並清除超過 14 天的舊備份。
# UTC 18:00 = 台灣時間（UTC+8）凌晨 2:00。可於 GitHub Actions 頁面手動觸發
# （workflow_dispatch），驗收與臨時補跑皆用此方式。
name: 每日自動備份

on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch: {}

jobs:
  backup:
    runs-on: ubuntu-latest
    # A156：一次性 Postgres 服務容器，僅用於驗證資料庫備份「真的能還原」，
    # 與正式站資料庫完全隔離，用完即棄（比照 KB-034 隔離環境驗證原則）。
    services:
      restore-target:
        # 版本需與 Supabase 伺服器（17.6）一致，避免 pg_dump 輸出的 DDL 含新版
        # 專屬語法而在舊版目標無法還原。用 pgvector 官方映像（非純 postgres），
        # 因為本專案 migration 0000 建了 vector 擴充套件（A54），stock postgres
        # 映像沒有內建 pgvector，CREATE EXTENSION vector 會直接失敗。
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: 安裝依賴
        run: pnpm install --frozen-lockfile

      # Ubuntu noble 原生套件庫只到 postgresql-client-16，比 Supabase 伺服器
      # （17.6）舊，pg_dump 會直接拒絕執行；需先加官方 PGDG 套件庫才有 -17。
      - name: 安裝 postgresql-client-17（pg_dump／psql）
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc --fail \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          . /etc/os-release
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt ${VERSION_CODENAME}-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install --yes postgresql-client-17

      - name: 設定日期標籤
        id: date
        run: echo "today=$(date -u +%F)" >> "$GITHUB_OUTPUT"

      - name: 資料庫備份（AC-1，僅 public schema，A152）
        env:
          SUPABASE_DB_URL_BACKUP: ${{ secrets.SUPABASE_DB_URL_BACKUP }}
        # 明確指定版本化路徑，不依賴 PATH／update-alternatives 解析到哪個
        # pg_dump——實測發現即使裝了 postgresql-client-17，PATH 上的
        # pg_dump 仍解析到 runner 預先安裝的舊版 16.14。
        # --clean --if-exists：dump 內含 DROP ... IF EXISTS 於 CREATE 之前，
        # 讓還原對「目標已存在 public schema」（任何全新 Postgres 資料庫的
        # 預設狀態，含還原驗證用的一次性容器）具備冪等性，不會卡在
        # schema "public" already exists。
        # --schema=public 的 dump 不含 CREATE EXTENSION（擴充套件非 schema
        # 物件），但索引等物件會明確寫成 public.gin_trgm_ops 這種帶 schema
        # 前綴的寫法——search_path 技巧無效，擴充套件必須真的裝在 public
        # 裡。用 sed 把本專案實際使用的兩個擴充套件（drizzle/0000／0009，
        # KB-029／A54）插在 dump 自己的 CREATE SCHEMA public; 之後，確保
        # 這兩行在「public 剛被重建、其餘表格與索引尚未建立」的時間點執行。
        run: |
          /usr/lib/postgresql/17/bin/pg_dump "$SUPABASE_DB_URL_BACKUP" \
            --schema=public --no-owner --no-privileges --clean --if-exists \
            -f "db-backup-${{ steps.date.outputs.today }}.sql"
          sed -i '/^CREATE SCHEMA public;/a CREATE EXTENSION IF NOT EXISTS vector;\nCREATE EXTENSION IF NOT EXISTS pg_trgm;' \
            "db-backup-${{ steps.date.outputs.today }}.sql"

      - name: 還原驗證（AC-2，A156：每次執行皆自動驗證，非僅驗收測一次）
        run: |
          set -e
          PSQL=/usr/lib/postgresql/17/bin/psql
          TARGET="postgresql://postgres:postgres@localhost:5432/postgres"
          "$PSQL" "$TARGET" \
            -v ON_ERROR_STOP=1 -f "db-backup-${{ steps.date.outputs.today }}.sql"
          TABLE_COUNT=$("$PSQL" "$TARGET" \
            -t -c "select count(*) from information_schema.tables where table_schema='public';" | tr -d ' ')
          echo "還原後 public schema 資料表數：$TABLE_COUNT"
          if [ "$TABLE_COUNT" -lt 24 ]; then
            echo "::error::還原後資料表數（$TABLE_COUNT）少於本專案已知的 24 張表，還原驗證失敗"
            exit 1
          fi

      - name: Storage 備份（AC-3）
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: pnpm exec tsx scripts/backup/dump-storage.ts "storage-backup-${{ steps.date.outputs.today }}.zip"

      - name: 上傳 Google Drive＋清除舊備份（AC-4／AC-5）
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
        run: |
          pnpm exec tsx scripts/backup/upload-to-drive.ts \
            "db-backup-${{ steps.date.outputs.today }}.sql" \
            "storage-backup-${{ steps.date.outputs.today }}.zip"
